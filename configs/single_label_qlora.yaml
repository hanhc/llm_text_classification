# configs/single_label_qlora.yaml

project:
  name: "single_label_qlora_example"
  seed: 42

data:
  path: "data/sample_single_label_data.csv"
  type: "single_label"
  text_column: "text"
  label_column: "category"
  test_size: 0.2
  eval_size: 0.25

model:
  # Using a larger model where QLoRA is more beneficial
  name: "meta-llama/Llama-2-7b-hf" # Requires Hugging Face login & access
  max_length: 512

tuning:
  strategy: "qlora"
  parameters:
    quantization:
      load_in_4bit: true
      bnb_4bit_quant_type: "nf4"
      bnb_4bit_compute_dtype: "bfloat16" # Use "float16" if your GPU doesn't support bfloat16
      bnb_4bit_use_double_quant: true
    lora:
      r: 64
      lora_alpha: 16
      lora_dropout: 0.1
      target_modules: ["q_proj", "v_proj"] # Specific to Llama models

training:
  output_dir: "outputs"
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  warmup_steps: 10
  weight_decay: 0.01
  logging_steps: 5
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "f1"
  greater_is_better: true
  fp16: false # fp16 is managed by bitsandbytes in QLoRA
  learning_rate: 2e-4
  gradient_accumulation_steps: 4
  report_to: "wandb"

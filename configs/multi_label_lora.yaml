# configs/multi_label_lora.yaml

project:
  name: "multi_label_lora_example"
  seed: 42

data:
  path: "data/sample_multi_label_data.csv"
  type: "multi_label"
  text_column: "review"
  label_column: "tags"
  test_size: 0.2
  eval_size: 0.25

model:
  name: "hfl/chinese-roberta-wwm-ext"
  max_length: 256

tuning:
  strategy: "lora"
  parameters:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.1
    target_modules: ["query", "key", "value"]

training:
  output_dir: "outputs"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  warmup_steps: 100
  weight_decay: 0.01
  logging_steps: 10
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "f1_micro (threshold_0.5)"
  greater_is_better: true
  fp16: true
  learning_rate: 1e-4 # Higher learning rate is common for LoRA
  gradient_accumulation_steps: 1
  report_to: "wandb" # Example of using wandb
  multi_label_threshold: 0.5

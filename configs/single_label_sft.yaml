# configs/single_label_sft.yaml

# Inherits from base, but we'll repeat for clarity
project:
  name: "single_label_sft_example"
  seed: 42

data:
  path: "data/sample_single_label_data.csv"
  type: "single_label"
  text_column: "text"
  label_column: "category"
  test_size: 0.2
  eval_size: 0.25

model:
  name: "hfl/chinese-bert-wwm-ext" # A good Chinese BERT
  max_length: 128

tuning:
  strategy: "sft"
  # No extra parameters needed for SFT

training:
  output_dir: "outputs"
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  warmup_steps: 50
  weight_decay: 0.01
  logging_steps: 10
  evaluation_strategy: "steps"
  save_strategy: "steps"
  load_best_model_at_end: true
  metric_for_best_model: "f1"
  greater_is_better: true
  fp16: true
  learning_rate: 3e-5
  gradient_accumulation_steps: 2
  report_to: "tensorboard"
